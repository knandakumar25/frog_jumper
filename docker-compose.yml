
services:
  # ==========================================
  # BUILD STAGE: Build and export all targets
  # ==========================================
  build:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: exporter
    volumes:
      - ./build:/mnt/build
    command: ["cp", "-r", "/app/build/.", "/mnt/build/"]

  # Android export (requires more resources)
  build-android:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: exporter-android
    volumes:
      - ./build:/mnt/build
    # Android builds need more memory
    deploy:
      resources:
        limits:
          memory: 8G
    command: ["cp", "-r", "/app/build/.", "/mnt/build/"]

  # ==========================================
  # USE CASE 1: CI/CD - Run headless test
  # ==========================================
  test:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-client
    depends_on:
      - build
    entrypoint: ["./build/linux/AxiomForceReclaimEarth.x86_64", "--headless", "--quit"]

  # ==========================================
  # USE CASE 2: Dedicated Multiplayer Server
  # ==========================================
  server:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-server
    depends_on:
      - build
    # Run server on port 7777 (configure as needed)
    ports:
      - "7777:7777/udp"
      - "7777:7777/tcp"
    # Server command line args (adjust for your game)
    # entrypoint: ["./build/linux_server/AxiomForceReclaimEarth_Server.x86_64", "--port", "7777"]
    # For now, keep container running for manual testing
    command: ["tail", "-f", "/dev/null"]

  # ==========================================
  # USE CASE 3: Local Web Testing (HTML5)
  # ==========================================
  web:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-web
    depends_on:
      - build
    ports:
      - "8080:8080"
    # Access at http://localhost:8080
    # Serves with COOP/COEP headers for SharedArrayBuffer support

  # ==========================================
  # USE CASE 4: Android Build (APK/AAB)
  # ==========================================
  android:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: android-artifact
    depends_on:
      - build-android
    # Artifact is copied to ./build/android/ via volume
    command: ["true"]

  # ==========================================
  # DEVELOPMENT: Full dev environment
  # ==========================================
  dev:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY:-:0}
    # Run Godot editor: docker compose run dev godot --editor
    # Run headless export: docker compose run dev godot --headless --export-release "Linux/X11" ...
    command: ["tail", "-f", "/dev/null"]

  # ==========================================
  # PRODUCTION: Client runtime (minimal)
  # ==========================================
  client:
    profiles: ["game"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-client
    depends_on:
      - build
    # For headless testing:
    # entrypoint: ["./build/linux/AxiomForceReclaimEarth.x86_64", "--headless"]
    command: ["tail", "-f", "/dev/null"]

  # ==========================================
  # SHARED ACCOUNTS BACKEND
  # ==========================================
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=accounts_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - backend_net

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    networks:
      - backend_net

  website:
    image: node:26-slim
    working_dir: /app
    volumes:
      - ./website:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
