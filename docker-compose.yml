# Axiom Force — local development stack (Docker Desktop / Compose v2).
#
# Start everything:   docker compose up -d
# Watch the backend:  docker compose logs -f backend
# Stop everything:    docker compose down
#
# Variables come from the gitignored `.env` in this directory (see
# `.env.example`). First run: copy `.env.example` to `.env` and set
# JWT_SIGNING_KEY (the backend refuses to start without it; the website and
# database still start, and `docker compose logs backend` says what is missing).
# Every other value has a safe default. The database password is shared between the `db`
# service (POSTGRES_PASSWORD) and the backend (DB_PASSWORD), so set both to the
# same value in `.env` if you change either.
name: axiom-force

services:
  # Opt-in ffmpeg media tooling (cutscene audio packaging and validators); never starts with
  # the application's always-on services. It no longer contains Blender.
  cutscene:
    profiles: ["cutscene"]
    build:
      context: ./tools/cutscene
    volumes:
      - ./:/workspace
    restart: "no"

  # PostgreSQL 18, matching the version the project documents. Data lives in
  # the named `pgdata` volume and survives `docker compose down`.
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounts_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Loopback only (2026-11-15 review): other machines cannot reach the database.
      # The game no longer connects here (2026-11-18): saves go through the backend API.
      # The port stays published for tools/db/backup.ps1 and local inspection.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ stores data in a major-version subdirectory and refuses
      # to start when the volume is mounted at the old /var/lib/postgresql/data
      # path, so the mount has to sit one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `backend` waits on this, so it must fail until the server accepts
      # connections — pg_isready only passes once the postmaster is up.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Accounts API: Express.js on Node 26 (replaced Django on 2026-11-15). On start it waits for
  # PostgreSQL and applies the SQL migrations in backend/migrations, then serves on 8000. The
  # `dev` target includes the test packages so `docker compose exec -T backend npm test` works.
  # There is no source bind mount (it would hide the image's node_modules); rebuild after
  # editing backend code: `docker compose up -d --build backend`.
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      # Optional so Compose itself does not fail before anyone copies .env.example to .env.
      # The API refuses to start without JWT_SIGNING_KEY (see backend/src/config.js); it then
      # restarts until the key is set, while the website and database keep running.
      - path: .env
        required: false
    environment:
      # Compose service name, not localhost: inside the network the database
      # answers to `db`.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-accounts_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Loopback only (2026-11-15 review): the game on this machine still reaches
      # localhost:8000, but other machines cannot call the API around nginx.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health answers 200 once the database is reachable.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # React + Vite build served by Nginx, which also proxies /api/ to `backend`
  # (see website/nginx.conf). FRONTEND_URL points at 5173, so that is the host
  # port this service is published on.
  website:
    build:
      context: ./website
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # Microsoft’s browser image is a one-shot verification tool, separate from the server.
  # Run with: docker compose run --rm playwright
  playwright:
    profiles: ["test"]
    build:
      context: ./tools/playwright
    init: true
    ipc: host
    environment:
      BASE_URL: http://website
      API_URL: http://backend:8000/api
      # Development-only E2E runner; the test refuses production Clerk keys.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on:
      - website
    restart: "no"

  # Headless game exporter (Godot 4.7.2 .NET + Android SDK + JDK 17, see
  # export/Dockerfile). It sits behind the `export` profile, so a plain
  # `docker compose up` NEVER starts it: exports are exclusive and may only be
  # invoked deliberately, with nothing else building at the same time:
  #
  #   docker compose run --rm export linux
  #   docker compose run --rm export android
  export:
    profiles: ["export"]
    image: axiom-force-export
    build:
      context: ./export
    working_dir: /workspace
    volumes:
      # The whole repository, because the exporter reads project.godot and
      # writes the exported binaries into ./build.
      - ./:/workspace
      # Godot's import cache and the .NET build outputs are redirected onto
      # container volumes on purpose: a full import through the Windows bind
      # mount runs at ~1 KB/s because the cache is thousands of small files,
      # while Linux-native I/O finishes in seconds. Only the finished export
      # artifacts cross back to the host.
      - export_godot:/workspace/.godot
      - export_dotnet_bin:/workspace/bin
      - export_dotnet_obj:/workspace/obj
    environment:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # Refuse game exports when Compose is invoked from a GitHub Actions runner.
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-false}
    # Inert by default: starting this container without an explicit target only
    # prints usage. An export runs solely for `docker compose run --rm export
    # <target>`, which overrides this command.
    command: ["help"]
    restart: "no"

volumes:
  pgdata:
  export_godot:
  export_dotnet_bin:
  export_dotnet_obj:
