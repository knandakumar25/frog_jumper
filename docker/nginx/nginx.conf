# Nginx configuration for serving Godot 4 Web exports
# Includes required COOP/COEP headers for SharedArrayBuffer support

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/wasm;

    # Cache static assets
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m inactive=60m use_temp_path=off;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers REQUIRED for Godot 4 Web exports (SharedArrayBuffer)
        # Cross-Origin Opener Policy
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Cross-Origin Embedder Policy
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # Additional security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Serve static files with caching
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets for 1 year
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # Special handling for .wasm files (WebAssembly)
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Special handling for .pck files (Godot resource packs)
        location ~* \.pck$ {
            add_header Content-Type application/octet-stream;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Prevent access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}