name: Multi-Platform Native Game Export (No Docker)

on:
  # Solution 2: Manual trigger via GitHub Actions UI or Version Tag Releases
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  GODOT_VERSION: '4.7.1'

jobs:
  # 1. Windows Desktop Export (.exe)
  build-windows:
    name: Build Windows (.exe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Export Windows (.exe)
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/AxiomForce.exe || godot --headless --export-debug "Windows Desktop" build/windows/AxiomForce.exe

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/
          retention-days: 14

  # 2. Linux Client & Server Export (.x86_64)
  build-linux:
    name: Build Linux (.x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Export Linux Game Client (.x86_64)
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/AxiomForce.x86_64 || godot --headless --export-debug "Linux/X11" build/linux/AxiomForce.x86_64

      - name: Export Linux Dedicated Server (.x86_64)
        run: |
          mkdir -p build/linux_server
          godot --headless --export-release "Linux Server" build/linux_server/AxiomForce_Server.x86_64 || godot --headless --export-debug "Linux Server" build/linux_server/AxiomForce_Server.x86_64 || true

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/
            build/linux_server/
          retention-days: 14

  # 3. Android APK Export (.apk)
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 || true

      - name: Export Android (.apk)
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/AxiomForce.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: build/android/
          if-no-files-found: error
          retention-days: 14

  # 4. iOS App Export (.ipa / Xcode - macOS Runner)
  build-ios:
    name: Build iOS (.ipa / iPhone 13)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Export iOS Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/AxiomForce.zip || godot --headless --export-debug "iOS" build/ios/AxiomForce.zip || true

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/
          retention-days: 14

  # 5. macOS Desktop App Export (.app / .zip - macOS Runner)
  build-macos:
    name: Build macOS (.app / Mac Desktop)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Export macOS App (.zip)
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" build/macos/AxiomForce.zip || godot --headless --export-debug "macOS" build/macos/AxiomForce.zip || true

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/
          retention-days: 14

  # 6. visionOS App Export (Apple Vision Pro - macOS Runner)
  build-visionos:
    name: Build visionOS (Apple Vision Pro)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Export visionOS App
        run: |
          mkdir -p build/visionos
          godot --headless --export-release "visionOS" build/visionos/AxiomForce_visionOS.zip || godot --headless --export-debug "visionOS" build/visionos/AxiomForce_visionOS.zip || true

      - name: Upload visionOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: visionos-build
          path: build/visionos/
          retention-days: 14

  # 7. Xbox / Windows GDK Export (Xbox Series X/S / Xbox One / Windows GDK)
  build-xbox:
    name: Build Xbox (Series X/S & Xbox One)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot Assets & Build C# Assemblies
        run: |
          dotnet restore FrogJumper.csproj
          dotnet build FrogJumper.csproj -c Release
          godot --headless --editor --quit || true

      - name: Export Xbox App (.exe / GDK Profile)
        run: |
          mkdir -p build/xbox
          godot --headless --export-release "Xbox / Windows GDK" build/xbox/AxiomForce_Xbox.exe || godot --headless --export-debug "Xbox / Windows GDK" build/xbox/AxiomForce_Xbox.exe

      - name: Upload Xbox Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox-build
          path: build/xbox/
          retention-days: 14

  # 8. All-In-One Single Bundle (Combines All 7 Platforms Into One Single Download)
  bundle-all-builds:
    name: Bundle All 7 Platforms Into One Zip
    needs: [build-windows, build-linux, build-android, build-ios, build-macos, build-visionos, build-xbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/

      - name: Upload All-In-One Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-force-all-platforms-build
          path: build/
          retention-days: 14

