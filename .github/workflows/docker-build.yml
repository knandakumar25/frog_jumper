name: Docker Build and Export

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-export:
    name: Build and Export Game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (builder stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          tags: frog-jumper:builder
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export game using Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: exporter
          tags: frog-jumper:exporter
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy exported game from container
        run: |
          docker create --name exporter frog-jumper:exporter
          docker cp exporter:/app/build ./build
          docker rm exporter

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/
          retention-days: 7

      - name: Test run (headless)
        run: |
          docker run --rm frog-jumper:exporter \
            ./build/linux/AxiomForceReclaimEarth.x86_64 --headless --quit

  # Optional: Publish to GitHub Container Registry
  publish:
    name: Publish to GHCR
    needs: build-and-export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max