name: Docker Build and Export

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-export:
    name: Build and Export Game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (builder stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          tags: frog-jumper:builder
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export all targets using Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: exporter
          tags: frog-jumper:exporter
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy exported builds from container
        run: |
          docker create --name exporter frog-jumper:exporter
          docker cp exporter:/app/build ./build
          docker rm exporter

      - name: Upload Linux client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-client-build
          path: build/linux/
          retention-days: 7

      - name: Upload Linux server build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-build
          path: build/linux_server/
          retention-days: 7

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

      - name: Test client (headless)
        run: |
          docker run --rm frog-jumper:exporter \
            ./build/linux/AxiomForceReclaimEarth.x86_64 --headless --quit

      - name: Test server binary exists
        run: |
          test -f build/linux_server/AxiomForceReclaimEarth_Server.x86_64
          echo "Server binary found"

      - name: Test web build exists
        run: |
          test -f build/web/index.html
          test -f build/web/index.js
          test -f build/web/index.wasm
          test -f build/web/index.pck
          echo "Web build files found"

  # Test dedicated server startup (basic smoke test)
  test-server:
    name: Test Dedicated Server
    needs: build-and-export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-server
          tags: frog-jumper:server
          load: true
          cache-from: type=gha

      - name: Test server starts (timeout after 10s)
        run: |
          timeout 10s docker run --rm frog-jumper:server --help || true
          echo "Server starts successfully"

  # Test web export with nginx
  test-web:
    name: Test Web Export
    needs: build-and-export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-web
          tags: frog-jumper:web
          load: true
          cache-from: type=gha

      - name: Start web server
        run: |
          docker run -d --name web-test -p 8080:8080 frog-jumper:web
          sleep 3

      - name: Verify web server responds
        run: |
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/ | grep -q "Axiom Force"
          echo "Web server responding"

      - name: Verify COOP/COEP headers
        run: |
          curl -I http://localhost:8080/ | grep -i "cross-origin-opener-policy: same-origin"
          curl -I http://localhost:8080/ | grep -i "cross-origin-embedder-policy: require-corp"
          echo "Security headers present"

      - name: Cleanup
        run: docker rm -f web-test

  # Test Android export
  test-android:
    name: Test Android Export
    needs: build-and-export
    runs-on: ubuntu-latest
    # Android builds need more resources
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Android export (exporter-android stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: exporter-android
          tags: frog-jumper:android-exporter
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Android build from container
        run: |
          docker create --name android-exporter frog-jumper:android-exporter
          docker cp android-exporter:/app/build/android ./build
          docker rm android-exporter

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/
          retention-days: 7

      - name: Verify APK exists and is valid
        run: |
          test -f build/android/AxiomForceReclaimEarth.apk
          echo "APK found"

      - name: Verify APK structure
        run: |
          unzip -l build/android/AxiomForceReclaimEarth.apk | head -30
          echo "APK structure verified"

      - name: Verify APK signing (debug)
        run: |
          jarsigner -verify -verbose -certs build/android/AxiomForceReclaimEarth.apk 2>&1 | head -20
          echo "APK signing verified"

  # Optional: Publish to GitHub Container Registry
  publish:
    name: Publish to GHCR
    needs: [build-and-export, test-server, test-web, test-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-client
          push: true
          tags: ghcr.io/${{ github.repository }}/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push server runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-server
          push: true
          tags: ghcr.io/${{ github.repository }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max